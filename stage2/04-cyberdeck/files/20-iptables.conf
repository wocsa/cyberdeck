# One compact record, written immediately, with no second copy from default rules.
template(name="CyberdeckNetwork" type="string"
    string="%timegenerated:::date-rfc3339% %hostname% net: %$.event%\n")

if $syslogfacility-text == "kern" and $msg contains "CDNET " then {
    set $.action = re_extract($msg, "CDNET ([A-Z]+) ([A-Z]+) ", 0, 1, "UNKNOWN");
    set $.status = re_extract($msg, "CDNET ([A-Z]+) ([A-Z]+) ", 0, 2, "UNKNOWN");
    set $.in = re_extract($msg, " IN=([^ ]*)", 0, 1, "");
    set $.out = re_extract($msg, " OUT=([^ ]*)", 0, 1, "");
    set $.direction = "IN";
    if $.in == "" then set $.direction = "OUT";
    if $.in != "" and $.out != "" then set $.direction = "FWD";
    set $.event = "ACTION=" & $.action & " STATUS=" & $.status & " DIR=" & $.direction;
    set $.proto = re_extract($msg, " PROTO=([^ ]+)", 0, 1, "-");
    set $.sport = "-";
    set $.dport = "-";
    # ICMP errors may embed another packet's ports; those are not ICMP ports.
    if $.proto == "TCP" or $.proto == "UDP" or $.proto == "UDPLITE" or $.proto == "SCTP" or $.proto == "DCCP" then {
        set $.sport = re_extract($msg, " SPT=([0-9]+)", 0, 1, "-");
        set $.dport = re_extract($msg, " DPT=([0-9]+)", 0, 1, "-");
    }
    set $.event = $.event & " PROTO=" & $.proto;
    set $.event = $.event & " SRC=" & re_extract($msg, " SRC=([^ ]+)", 0, 1, "-");
    set $.event = $.event & " SPT=" & $.sport;
    set $.event = $.event & " DST=" & re_extract($msg, " DST=([^ ]+)", 0, 1, "-");
    set $.event = $.event & " DPT=" & $.dport;
    if $.in != "" then set $.event = $.event & " IN=" & $.in;
    if $.out != "" then set $.event = $.event & " OUT=" & $.out;
    if $msg contains " TYPE=" then {
        set $.event = $.event & " TYPE=" & re_extract($msg, " TYPE=([0-9]+)", 0, 1, "-");
        set $.event = $.event & " CODE=" & re_extract($msg, " CODE=([0-9]+)", 0, 1, "-");
    }
    action(type="omfile" file="/var/log/syslog" template="CyberdeckNetwork"
           asyncWriting="off" flushOnTXEnd="on")
    stop
}
