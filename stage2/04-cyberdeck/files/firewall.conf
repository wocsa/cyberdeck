# Shared IPv4/IPv6 rules. ACCEPT policies preserve the open training environment.
# Reserve only connmark bit 0x80000000; leave all other mark bits untouched.
*filter
:INPUT ACCEPT [0:0]
:FORWARD ACCEPT [0:0]
:OUTPUT ACCEPT [0:0]
:LOGGING - [0:0]
:CD_NEW - [0:0]
:CD_RELATED - [0:0]
:CD_INVALID - [0:0]
:CD_UNTRACKED - [0:0]
:CD_DROP - [0:0]
:CD_REJECT - [0:0]
:CD_DROP_LOG - [0:0]
:CD_REJECT_LOG - [0:0]

# RETURN from LOGGING so appended exercise rules remain reachable.
-A INPUT ! -i lo -j LOGGING
-A FORWARD -j LOGGING
-A OUTPUT ! -o lo -j LOGGING
-A LOGGING -m conntrack --ctstate ESTABLISHED -j RETURN
-A LOGGING -m conntrack --ctstate NEW -m connmark ! --mark 0x80000000/0x80000000 -j CD_NEW
-A LOGGING -m conntrack --ctstate RELATED -j CD_RELATED
-A LOGGING -m conntrack --ctstate INVALID -j CD_INVALID
-A LOGGING -m conntrack --ctstate UNTRACKED -j CD_UNTRACKED
-A CD_NEW -j CONNMARK --or-mark 0x80000000
-A CD_NEW -j LOG --log-prefix "CDNET OBSERVE NEW " --log-level 6

# Insert exercise rules targeting these chains BEFORE the LOGGING jump.
# Their terminal verdict is unconditional, even when a repeat log is suppressed.
-A CD_DROP -j CD_DROP_LOG
-A CD_DROP -j DROP
-A CD_REJECT -j CD_REJECT_LOG
-A CD_REJECT -j REJECT

# No global rate cap: different TCP/UDP tuples are independent.
# For events without durable connection state, emit the first immediately,
# then at most once per 10 seconds per tuple. Separate TCP and UDP buckets.
# Other protocols use endpoint pairs (they need not have transport ports).
-A CD_RELATED -p tcp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_rel_t --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE RELATED " --log-level 6
-A CD_RELATED -p tcp -j RETURN
-A CD_RELATED -p udp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_rel_u --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE RELATED " --log-level 6
-A CD_RELATED -p udp -j RETURN
-A CD_RELATED -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip --hashlimit-name cd_rel_o --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE RELATED " --log-level 6

-A CD_INVALID -p tcp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_inv_t --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE INVALID " --log-level 6
-A CD_INVALID -p tcp -j RETURN
-A CD_INVALID -p udp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_inv_u --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE INVALID " --log-level 6
-A CD_INVALID -p udp -j RETURN
-A CD_INVALID -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip --hashlimit-name cd_inv_o --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE INVALID " --log-level 6

-A CD_UNTRACKED -p tcp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_unt_t --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE UNTRACKED " --log-level 6
-A CD_UNTRACKED -p tcp -j RETURN
-A CD_UNTRACKED -p udp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_unt_u --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE UNTRACKED " --log-level 6
-A CD_UNTRACKED -p udp -j RETURN
-A CD_UNTRACKED -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip --hashlimit-name cd_unt_o --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET OBSERVE UNTRACKED " --log-level 6

-A CD_DROP_LOG -p tcp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_drop_t --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET DROP BLOCKED " --log-level 6
-A CD_DROP_LOG -p tcp -j RETURN
-A CD_DROP_LOG -p udp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_drop_u --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET DROP BLOCKED " --log-level 6
-A CD_DROP_LOG -p udp -j RETURN
-A CD_DROP_LOG -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip --hashlimit-name cd_drop_o --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET DROP BLOCKED " --log-level 6

-A CD_REJECT_LOG -p tcp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_reject_t --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET REJECT BLOCKED " --log-level 6
-A CD_REJECT_LOG -p tcp -j RETURN
-A CD_REJECT_LOG -p udp -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip,srcport,dstport --hashlimit-name cd_reject_u --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET REJECT BLOCKED " --log-level 6
-A CD_REJECT_LOG -p udp -j RETURN
-A CD_REJECT_LOG -m hashlimit --hashlimit-upto 6/min --hashlimit-burst 1 --hashlimit-mode srcip,dstip --hashlimit-name cd_reject_o --hashlimit-htable-expire 10000 --hashlimit-htable-max 16384 -j LOG --log-prefix "CDNET REJECT BLOCKED " --log-level 6

COMMIT
