name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install host emulation and validation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static network-manager
    - name: Check Cyberdeck migration regressions
      run: python3 -m unittest discover -s tests -v
    - name: Build Cyberdeck image
      run: ./build-docker.sh
